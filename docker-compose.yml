services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php
    networks:
      - rede-projeto

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    networks:
      - rede-projeto
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=SenhaSegura123
      - DB_NAME=meubanco

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SenhaSegura123
      MYSQL_DATABASE: meubanco
    volumes:
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql
    networks:
      - rede-projeto

networks:
  rede-projeto:
    driver: bridge